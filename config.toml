#
# Build using the Hugo version pinned in .github/workflows/deploy.yml.
# No theme: layouts/ and static/css/style.css are the whole frontend.
#
baseurl = "https://www.bcastell.com/"
title = "Brandon Castellano"
locale = "en-us"
defaultContentLanguage = "en"

pluralizelisttitles = false

[services]
    [services.disqus]
        shortname = "bcastell"

[pagination]
    pagerSize = 10

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            # Content bodies contain raw HTML (badges, embeds, contact form).
            unsafe = true
    [markup.highlight]
        # Class-based highlighting; palettes live at the end of style.css.
        noClasses = false

[taxonomies]
    category = "categories"
    tag = "tags"

[permalinks]
    posts = "/posts/:contentbasename/"

[menu]
[[menu.main]]
    name   = "Projects"
    url    = "/projects/"
    weight = 1

[[menu.main]]
    name   = "Posts"
    url    = "/posts/"
    weight = 2

[[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 3

[[menu.main]]
    name   = "Contact"
    url    = "/contact/"
    weight = 4

[params]
    author = "Brandon Castellano"
    description = "The internet home of Brandon Castellano"
    mainSections = ["posts"]
    copyright = "Copyright &copy; 2026 Brandon Castellano.  All rights reserved."
